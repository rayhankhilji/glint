# SwiftLint 0.65.1 — run `swiftlint --strict` (EVAL_GUARDRAILS §7.1)
included:
  - App
  - Packages/GlintCore/Sources
  - Packages/GlintCore/Tests
  - Packages/GlintKit/Sources
  - Packages/GlintKit/Tests
  - UITests
excluded:
  - "**/.build"
  - Packages/GlintKit/Sources/GlintUI/Icons/GlintIconData.swift   # generated (scripts/icons/build_icons.py)
  - Packages/GlintKit/Sources/GlintUI/DesignSystem/GlintColorTokens.swift   # generated (scripts/design/build_tokens.py)
  - .tools
  - build

disabled_rules:
  - todo                    # TODOs are banned outright by check-architecture.sh unless they carry a blocker ID
  - trailing_comma          # SwiftFormat owns trailing commas
  - opening_brace           # SwiftFormat owns brace placement
opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - empty_count
  - first_where
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - fatal_error_message
  - private_action
  - unowned_variable_capture
  - yoda_condition

line_length:
  warning: 120
  error: 140
  ignores_comments: true
  ignores_urls: true
cyclomatic_complexity:
  warning: 10
  error: 15
function_body_length:
  warning: 40
  error: 60
file_length:
  warning: 300
  error: 500
type_body_length:
  warning: 250
  error: 400
identifier_name:
  min_length: 1
  max_length: 50
type_name:
  max_length: 50
large_tuple:
  warning: 3
nesting:
  type_level: 2
force_unwrapping:
  severity: error

custom_rules:
  no_print:
    name: "No print"
    regex: '^\s*print\('
    excluded: '.*/Sources/glint-eval/.*|.*Tests/.*'
    message: "Use GlintLog (os.Logger) — print is banned (INSTRUCTIONS §6)."
    severity: error
  no_magic_thresholds:
    name: "No magic thresholds in intent machines"
    included: '.*/Sources/GlintCore/Intent/.*\.swift'
    excluded: '.*/IntentConstants\.swift'
    regex: '(?<![\w.])(?:[2-9]|\d{2,}|\d*\.\d+)(?![\w.])'
    match_kinds: number
    message: "Thresholds live in IntentConstants or Settings defaults (G-ML-05)."
    severity: error
  no_dispatch_main:
    name: "No DispatchQueue.main.async"
    regex: 'DispatchQueue\.main\.async'
    message: "Use @MainActor (INSTRUCTIONS §6)."
    severity: error
  no_glass_effect_outside_surface:
    name: "glassEffect only inside GlassSurface"
    regex: '\.glassEffect\('
    excluded: '.*/DesignSystem/GlassSurface\.swift'
    message: "Use GlassSurface (INSTRUCTIONS §7)."
    severity: error
