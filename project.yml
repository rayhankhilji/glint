# XcodeGen 2.46.0 — the only source of truth for Saccade.xcodeproj (ADR-009). Never edit or commit the .xcodeproj.
name: Saccade
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "27.1"
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  SaccadeKit:
    path: Packages/SaccadeKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Saccade:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: SaccadeKit
        products: [SaccadePlatform, SaccadePerception, SaccadeServices, SaccadeUI, SaccadeRuntime]
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: Saccade
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SaccadeUITestsApp:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: Saccade
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SACCADE_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        CODE_SIGN_ENTITLEMENTS: ""
        ENABLE_HARDENED_RUNTIME: NO
        TEST_TARGET_NAME: Saccade
schemes:
  Saccade:
    build:
      targets:
        Saccade: all
        SaccadeUITestsApp: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SaccadeUITestsApp
    archive:
      config: Release
