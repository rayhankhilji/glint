# XcodeGen 2.46.0 — the only source of truth for Glint.xcodeproj (ADR-009). Never edit or commit the .xcodeproj.
name: Glint
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "27.1"
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  GlintKit:
    path: Packages/GlintKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Glint:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: GlintKit
        products: [GlintPlatform, GlintPerception, GlintServices, GlintUI, GlintRuntime]
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: Glint
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GlintUITestsApp:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: Glint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GLINT_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        CODE_SIGN_ENTITLEMENTS: ""
        ENABLE_HARDENED_RUNTIME: NO
        TEST_TARGET_NAME: Glint
schemes:
  Glint:
    build:
      targets:
        Glint: all
        GlintUITestsApp: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - GlintUITestsApp
    archive:
      config: Release
