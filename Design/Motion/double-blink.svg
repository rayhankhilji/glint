<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220" role="img">
  <title>Double blink</title>
  <desc>The mark teaches the gesture: two deliberate blinks (80 ms close, 120 ms open, 180 ms apart), then the catchlight pulses to show the click.</desc>
  <rect width="400" height="220" rx="12" fill="#F3F4F6"/><g transform="translate(200 112)"><g><animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 0.06;1 1;1 1;1 0.06;1 1;1 1" keyTimes="0;0.23;0.26;0.31;0.38;0.41;0.45;1" dur="2.6s" repeatCount="indefinite"/><g transform="translate(-200 -112)"><circle cx="200" cy="112" r="52.8" fill="none" stroke="#0F1011" stroke-width="11.2"/><g transform="translate(217.6 94.4)"><g><animateTransform attributeName="transform" type="scale" values="1;1;1.5;0.94;1;1" keyTimes="0;0.45;0.51;0.58;0.66;1" dur="2.6s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.2 0 0 1;0.2 0 0 1;0.2 0 0 1;0 0 1 1"/><g transform="translate(-217.6 -94.4)"><circle cx="217.6" cy="94.4" r="14.4" fill="#6366F1"/></g></g></g></g></g></g>
</svg>
