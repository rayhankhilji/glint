<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220" role="img">
  <title>Glide scroll</title>
  <desc>Gaze settles in the bottom 15% of the scroll area; a 2 pt progress line fills during the 300 ms dwell, then the page glides up 40% of its height over 520 ms on the glide curve.</desc>
