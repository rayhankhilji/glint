<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220" role="img">
  <title>Target highlight: acquire, arm, click</title>
  <desc>Gaze settles on a button: a 1.5 pt indigo ring with an 8% fill appears (scale 1.04 to 1, 140 ms). The first blink arms it (2 pt ring, 14% fill); the second clicks: a 24% flash, then the highlight contracts and fades (180 ms).</desc>
  <rect x="0.5" y="0.5" width="399" height="219" rx="12" fill="#FFFFFF" stroke="#0F101114"/><path d="M0.5 30 H399.5" stroke="#0F101114"/><circle cx="18" cy="15" r="4.5" fill="#D5D7DB"/><circle cx="32" cy="15" r="4.5" fill="#D5D7DB"/><circle cx="46" cy="15" r="4.5" fill="#D5D7DB"/><rect x="40" y="54" width="220" height="7" rx="3.5" fill="#E4E5E8"/><rect x="40" y="74" width="300" height="7" rx="3.5" fill="#E4E5E8"/><rect x="40" y="94" width="260" height="7" rx="3.5" fill="#E4E5E8"/><rect x="150" y="112" width="100" height="30" rx="6" fill="#0F1011"><animate attributeName="fill-opacity" values="1;1;0.82;1;1" keyTimes="0;0.47;0.49;0.56;1" dur="3.2s" repeatCount="indefinite"/></rect><rect x="180" y="124" width="40" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.85"/><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.12;0.17;0.49;0.54;1" dur="3.2s" repeatCount="indefinite"/><g transform="translate(200 127)"><g><animateTransform attributeName="transform" type="scale" values="1.04;1.04;1;1;0.97;0.97" keyTimes="0;0.12;0.17;0.49;0.54;1" dur="3.2s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0 0 0 1;0 0 1 1;0.3 0 1 1;0 0 1 1"/><g transform="translate(-200 -127)"><rect x="146" y="108" width="108" height="38" rx="10" fill="#6366F1"><animate attributeName="fill-opacity" values="0.08;0.08;0.14;0.14;0.24;0.24" keyTimes="0;0.37;0.4;0.47;0.49;1" dur="3.2s" repeatCount="indefinite"/></rect><rect x="146" y="108" width="108" height="38" rx="10" fill="none" stroke="#6366F1" stroke-width="1.5"><animate attributeName="stroke-width" values="1.5;1.5;2;2" keyTimes="0;0.37;0.4;1" dur="3.2s" repeatCount="indefinite"/></rect></g></g></g></g>
</svg>
