<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220" role="img">
  <title>Glint: acquire, arm, click</title>
  <desc>Gaze fixates on a button: the glint ring scales 1.06 to 1 in 140 ms, brightens when armed by the first blink, then flares (260 ms) on the second blink while the button registers the press.</desc>
