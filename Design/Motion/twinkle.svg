<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220" role="img">
  <title>Glint twinkle</title>
  <desc>While tracking, the mark's glint twinkles once every 12 s: scale 1 to 1.25 and a quarter turn over 600 ms (the glint is 4-fold symmetric, so the loop is seamless). This study compresses the rest period to 1.8 s.</desc>
  <rect width="400" height="220" rx="14" fill="#17181B"/>
<g transform="translate(200 110)"><g><animateTransform attributeName="transform" type="scale" values="1;1;1.25;0.97;1" keyTimes="0;0.75;0.85;0.94;1" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.2 0 0 1;0.2 0 0 1;0.2 0 0 1"/><g><animateTransform attributeName="transform" type="rotate" values="0;0;90;90" keyTimes="0;0.75;1;1" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.2 0 0 1;0 0 1 1"/><path d="M0 -56 C7.39 -32.03 32.03 -7.39 56 0 C32.03 7.39 7.39 32.03 0 56 C-7.39 32.03 -32.03 7.39 -56 0 C-32.03 -7.39 -7.39 -32.03 0 -56 Z" fill="#FFD98A"/></g></g></g>
</svg>
