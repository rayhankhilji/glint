<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220" role="img">
  <title>Live mark</title>
  <desc>While Glint is tracking, the catchlight swells once every 8 s (scale 1 to 1.3, 500 ms). This study shortens the rest period to 1.5 s.</desc>
  <rect width="400" height="220" rx="12" fill="#F3F4F6"/><circle cx="200" cy="110" r="52.8" fill="none" stroke="#0F1011" stroke-width="11.2"/><g transform="translate(217.6 92.4)"><g><animateTransform attributeName="transform" type="scale" values="1;1;1.3;0.97;1" keyTimes="0;0.75;0.85;0.94;1" dur="2s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.2 0 0 1;0.2 0 0 1;0.2 0 0 1"/><g transform="translate(-217.6 -92.4)"><circle cx="217.6" cy="92.4" r="14.4" fill="#6366F1"/></g></g></g>
</svg>
